        <section class="forum" aria-label="PC Forum">
        <h2 class="forum-title">PC Forum</h2>
        <form class="forum-form" onsubmit="postForum(event)">
          <textarea id="forum-text" placeholder="Type Response Here"></textarea>
          <div class="forum-controls">
            <button type="submit" class="btn-post">Post</button>
          </div> 
        </form> 
            <div id="forum-posts"></div>
      </section> 
         <script>
  const form = document.querySelector(".forum-form");
  const textarea = form.querySelector("textarea");
  const postsContainer = document.getElementById("forum-posts");

  // Load saved posts
  const savedPosts = JSON.parse(localStorage.getItem("posts")) || [];
  savedPosts.forEach(addPostToPage);

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const text = textarea.value.trim();
    if (text === "") return;

    savedPosts.unshift(text);
    localStorage.setItem("posts", JSON.stringify(savedPosts));

    addPostToPage(text);
    textarea.value = "";
  });

  function addPostToPage(text) {
    const post = document.createElement("div");
    post.classList.add("card");
    post.style.marginTop = "10px";
    post.style.padding = "10px";
    post.innerText = text;

    postsContainer.prepend(post);
  }
</script>
